# ==========================================
# The Coffee Kartel - Local Development Profile
# Persistent file-backed database in ./data/
# Compatible with MySQL mode
# ==========================================

spring.datasource.url=jdbc:h2:file:./data/coffee_kartel_db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Development administrator credentials (for local development only)
app.admin.email=admin@coffeekartel.com
app.admin.password=Admin@123
