# ==========================================
# The Coffee Kartel - Spring Boot Configuration
# ==========================================

spring.application.name=coffee-kartel-backend
server.port=${PORT:8081}

# Active Profile: 'mysql' (production default) or 'local' (file-backed persistent DB)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Common Security & JWT Settings
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
