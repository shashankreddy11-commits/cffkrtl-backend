# ==========================================
# The Coffee Kartel - Test Configuration
# Uses isolated in-memory H2 database
# ==========================================

spring.application.name=coffee-kartel-backend-test
server.port=0

# In-Memory H2 for automated builds and tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT Secret (at least 256 bits)
app.jwt.secret=TestingOnlySecretKeyWithAtLeast256BitsLengthForHmacSha256SecurityValidation123456789TestKey!
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:3000
